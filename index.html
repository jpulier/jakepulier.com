<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake Pulier</title>
    <meta name="description" content="Growth marketer and musician in New York. Partner at Mercer Ads, CEO of FloWave. I make music as Pulyay.">
    <meta property="og:title" content="Jake Pulier">
    <meta property="og:description" content="Growth marketer and musician in New York. Partner at Mercer Ads, CEO of FloWave. I make music as Pulyay.">
    <meta property="og:image" content="https://www.jakepulier.com/portrait.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@jakepulier">
    <meta name="color-scheme" content="light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&family=Homemade+Apple&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FBFBFA;
            --text: #1A1A1A;
                        --soft: #5E5E5E;
            --rule: #E6E6E3;
            --ink: #7A1526;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--paper);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: #111111;
            text-decoration: underline;
            text-decoration-color: #C9C9C9;
            text-underline-offset: 3px;
            transition: color .15s ease, text-decoration-color .15s ease;
        }

        a:hover {
            color: var(--ink);
            text-decoration-color: currentColor;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 88px 20px 112px;
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        header {
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        .portrait {
            width: 168px;
            height: 168px;
            object-fit: cover;
            object-position: center 22%;
            mix-blend-mode: multiply;
        }

        .me {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: 18px;
        }

        .me svg { margin-left: -6px; }

        .me span {
            font-family: 'Homemade Apple', cursive;
            font-size: 18px;
            color: var(--ink);
            margin-left: 52px;
            margin-top: -30px;
        }

        section {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        h1 {
            margin-bottom: 4px;
            font-family: 'Newsreader', Georgia, serif;
            font-size: 40px;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        /* the arrow draws itself in on load */
        .draw path {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: draw .9s ease-out .2s forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .draw path {
                animation: none;
                stroke-dashoffset: 0;
            }
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding-top: 24px;
            border-top: 1px solid var(--rule);
            color: var(--soft);
            font-size: 14px;
        }

        footer nav {
            display: flex;
            gap: 18px;
        }

        @media (max-width: 600px) {
            main {
                padding: 56px 20px 80px;
                gap: 44px;
            }

            .portrait {
                width: 136px;
                height: 136px;
            }

            h1 { font-size: 34px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <img src="portrait.jpg" alt="Pencil portrait of Jake Pulier" class="portrait">
            <div class="me">
                <svg class="draw" width="72" height="40" viewBox="0 0 72 40" fill="none" aria-hidden="true"><path d="M68 6 C 50 4, 26 10, 8 30 M8 30 L 9 18 M8 30 L 20 28" stroke="#7A1526" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>me</span>
            </div>
        </header>

        <section>
            <h1>Hi, I'm Jake.</h1>
            <p>I'm a growth marketer and musician in New York. Partner at <a href="https://mercerads.com">Mercer Ads</a>, a creative agency for paid ads, and CEO of <a href="https://flowave.co">FloWave</a>.</p>
            <p>I make music as <a href="https://open.spotify.com/artist/01S3mAkOdHDp4L9qho7N6B">Pulyay</a>.</p>
        </section>

        <footer>
            <span>Say hi: <a href="mailto:jpulier@gmail.com">jpulier@gmail.com</a></span>
            <nav>
                <a href="https://x.com/jakepulier">X</a>
                <a href="https://www.linkedin.com/in/jake-pulier-bb0152150/">LinkedIn</a>
                <a href="https://open.spotify.com/artist/01S3mAkOdHDp4L9qho7N6B">Spotify</a>
            </nav>
        </footer>
    </main>
</body>
</html>
